name: Build & deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: dist }
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If the repo's Pages source is still "Deploy from a branch", GitHub also runs its own
      # Jekyll deploy of the RAW sources (index.html → ./src/main.ts, which browsers can't run)
      # and whichever finishes last wins. Wait for it, then publish the built game on top.
      # Setting Settings → Pages → Source to "GitHub Actions" removes that deploy entirely.
      - name: Let any legacy branch deploy finish first
        run: sleep 90
      - id: deployment
        uses: actions/deploy-pages@v4
